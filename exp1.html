<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>Bootstrap Experiment</title>
 <!-- Bootstrap CSS CDN -->
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
rel="stylesheet">
</head>
<body>
 <div class="container mt-5">
 <h1 class="text-center text-primary">Welcome to Bootstrap</h1>
 <p class="text-center">
 This is a simple responsive webpage created using Bootstrap.
 </p>
 <div class="row mt-4">
  <div class="col-md-4">
 <div class="card">
 <div class="card-body">
 <h5 class="card-title">HTML</h5>
 <p class="card-text">Structure of the webpage.</p>

 </div>
 </div>
 </div>
 <div class="col-md-4">
 <div class="card">
 <div class="card-body">
 <h5 class="card-title">CSS</h5>

 <button class="btn btn-success">Learn More</button>
 </div>
 </div>
 </div>
 <div class="col-md-4">
 <div class="card">
 <div class="card-body">
 <h5 class="card-title">Bootstrap</h5>

 <button class="btn btn-warning">Learn More</button>
 </div>
 </div>
 </div>
 </div>
 </div>
 <!-- Bootstrap JS CDN -->
 <script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
